name: Build & Deploy to EC2 via OIDC

on:
  push:
    branches:
      - main
    paths-ignore:
      - "charts/techblog/values.yaml"
  workflow_dispatch:

permissions:
  id-token: write # Required for AWS OIDC authentication
  contents: write # Required to push updated image tag to charts/techblog/values.yaml

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Image Tag from Commit SHA
        id: vars
        run: echo "image_tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Backend (amd64 + arm64)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/techblog-backend:${{ steps.vars.outputs.image_tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/techblog-backend:v1.0.0
            ${{ secrets.DOCKERHUB_USERNAME }}/techblog-backend:latest

      - name: Build & Push Frontend (amd64 + arm64)
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          platforms: linux/amd64,linux/arm64
          build-args: |
            VITE_API_URL=/api/v1
          push: true
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/techblog-frontend:${{ steps.vars.outputs.image_tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/techblog-frontend:v1.0.0
            ${{ secrets.DOCKERHUB_USERNAME }}/techblog-frontend:latest

      - name: Update Helm values.yaml for ArgoCD GitOps
        run: |
          yq -i '.backend.image.tag = "${{ steps.vars.outputs.image_tag }}"' charts/techblog/values.yaml
          yq -i '.frontend.image.tag = "${{ steps.vars.outputs.image_tag }}"' charts/techblog/values.yaml

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add charts/techblog/values.yaml
          git diff --staged --quiet || git commit -m "chore(helm): update image tags to ${{ steps.vars.outputs.image_tag }} [skip ci]"
          git push origin main

  deploy-to-ec2:
    name: Deploy to EC2 via OIDC & SSM
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to Kubernetes on EC2 via SSM
        run: |
          echo "🚀 Sending deployment command to EC2 instance: ${{ secrets.EC2_INSTANCE_ID }}"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy TechBlog update via GitHub Actions" \
            --parameters 'commands=[
              "set -e",
              "mkdir -p /home/ubuntu/.kube",
              "if [ -f /etc/rancher/k3s/k3s.yaml ]; then cp -f /etc/rancher/k3s/k3s.yaml /home/ubuntu/.kube/config && chown -R ubuntu:ubuntu /home/ubuntu/.kube && chmod 600 /home/ubuntu/.kube/config; fi",
              "if ! command -v helm &> /dev/null; then curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash; fi",
              "if [ ! -d /home/ubuntu/techblog-python-vue ]; then sudo -u ubuntu git clone https://github.com/Hasibul-Islam-Shanto/k8s-practise.git /home/ubuntu/techblog-python-vue; fi",
              "cd /home/ubuntu/techblog-python-vue",
              "sudo -u ubuntu git pull origin main",
              "sudo -u ubuntu KUBECONFIG=/home/ubuntu/.kube/config helm upgrade --install techblog ./charts/techblog --namespace techblog --create-namespace --set backend.image.repository=${{ secrets.DOCKERHUB_USERNAME }}/techblog-backend --set frontend.image.repository=${{ secrets.DOCKERHUB_USERNAME }}/techblog-frontend",
              "sudo -u ubuntu KUBECONFIG=/home/ubuntu/.kube/config kubectl rollout restart deployment backend frontend -n techblog",
              "sudo -u ubuntu KUBECONFIG=/home/ubuntu/.kube/config kubectl rollout status deployment/backend -n techblog --timeout=180s",
              "sudo -u ubuntu KUBECONFIG=/home/ubuntu/.kube/config kubectl rollout status deployment/frontend -n techblog --timeout=180s"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "Command ID: $COMMAND_ID"
          echo "⏳ Waiting for deployment to complete on EC2..."

          # Wait until SSM command finishes executing
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}"

          # Fetch execution status and stdout
          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --query "Status" \
            --output text)

          echo "Deployment finished with status: $STATUS"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --query "StandardOutputContent" \
            --output text

          if [ "$STATUS" != "Success" ]; then
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
              --query "StandardErrorContent" \
              --output text
            exit 1
          fi
          echo "✅ TechBlog successfully deployed to EC2 Kubernetes!"
