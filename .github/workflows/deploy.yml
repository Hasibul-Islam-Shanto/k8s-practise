name: Test AWS OIDC Connection

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write # Required for requesting the OIDC JWT
  contents: read

jobs:
  test-aws-oidc:
    name: Verify AWS OIDC Handshake
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: GitHubActions-OIDC-Test
          aws-region: ${{ secrets.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Verify Assumed Identity
        run: |
          echo "🎉 Successfully authenticated with AWS OIDC!"
          aws sts get-caller-identity
