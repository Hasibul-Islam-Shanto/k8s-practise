apiVersion: v1
kind: ConfigMap
metadata:
  name: techblog-config
  labels:
    {{- include "techblog.labels" . | nindent 4 }}
data:
  MYSQL_DATABASE: {{ .Values.database.name | quote }}
  MYSQL_USER: {{ .Values.database.user | quote }}
  FRONTEND_URL: {{ .Values.backend.frontendUrl | quote }}
  LOG_LEVEL: {{ .Values.backend.logLevel | quote }}
