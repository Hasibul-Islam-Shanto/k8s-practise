apiVersion: v1
kind: Secret
metadata:
  name: techblog-secret
  labels:
    {{- include "techblog.labels" . | nindent 4 }}
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: {{ .Values.database.rootPassword | quote }}
  MYSQL_PASSWORD: {{ .Values.database.password | quote }}
  JWT_SECRET: {{ .Values.backend.jwtSecret | quote }}
  DATABASE_URL: "mysql+pymysql://{{ .Values.database.user }}:{{ .Values.database.password }}@db:3306/{{ .Values.database.name }}"
