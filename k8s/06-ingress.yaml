apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: techblog-ingress
  namespace: techblog
  labels:
    app.kubernetes.io/name: techblog
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
spec:
  ingressClassName: nginx
  rules:
    # No "host" specified: catches ALL traffic (localhost, 127.0.0.1, or custom domains)
    - http:
        paths:
          # Direct backend API access (docs, metrics, API endpoints)
          - path: /api/v1
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          # Frontend SPA & static files (catches all other routes)
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
