# Scrape targets for this TechBlog stack.
# The app job name must match APP_JOB_NAME in .env.monitoring.
# Grafana dashboard queries use that same job label.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: techblog-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]
        labels:
          application: techblog
          environment: local

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          application: techblog
          environment: local

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          application: techblog
          environment: local
