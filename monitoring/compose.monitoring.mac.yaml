# Docker Desktop monitoring stack. Project-specific names come from .env.monitoring.
# See .env.monitoring.example for what to change for another application.
# Host mounts differ from compose.monitoring.yaml so cAdvisor and Node Exporter run on a Mac.

name: ${MONITORING_COMPOSE_NAME:-incident-observability}

services:

  prometheus:
    image: prom/prometheus:v3.14.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d

    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

    ports:
      - "127.0.0.1:9090:9090"

    networks:
      - monitoring
      - observability


  loki:
    image: grafana/loki:3.7.6
    restart: unless-stopped

    command:
      - -config.file=/etc/loki/loki-config.yml

    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki

    ports:
      - "127.0.0.1:3100:3100"

    networks:
      - monitoring


  alloy:
    image: grafana/alloy:v1.18.0
    restart: unless-stopped

    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy

    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data

    ports:
      - "127.0.0.1:12345:12345"

    depends_on:
      - loki

    networks:
      - monitoring


  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.12.1
    restart: unless-stopped

    command:
      - --path.rootfs=/host

    volumes:
      - /:/host:ro

    networks:
      - monitoring


  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.5
    restart: unless-stopped

    privileged: true

    volumes:
      - /:/rootfs:ro
      # Mount the socket file, not the /var/run directory. On Docker Desktop
      # that directory contains a symlink to ~/.docker/run/docker.sock, which
      # does not resolve inside the container.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro

    networks:
      - monitoring


  grafana:
    image: grafana/grafana:13.2.0
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/etc/grafana/render-dashboard.sh"]

    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env.monitoring}
      GF_USERS_ALLOW_SIGN_UP: "false"
      APP_JOB_NAME: ${APP_JOB_NAME:-incident-backend}
      APP_COMPOSE_PROJECT: ${APP_COMPOSE_PROJECT:-incident-app}
      APP_HTTP_REQUESTS_METRIC: ${APP_HTTP_REQUESTS_METRIC:-incident_http_requests_total}
      APP_HTTP_DURATION_BUCKET_METRIC: ${APP_HTTP_DURATION_BUCKET_METRIC:-incident_http_request_duration_seconds_bucket}
      APP_PROCESS_MEMORY_METRIC: ${APP_PROCESS_MEMORY_METRIC:-incident_backend_process_resident_memory_bytes}
      APP_ROUTE_FILTER: ${APP_ROUTE_FILTER:-/api/.*}
      APP_DISPLAY_NAME: ${APP_DISPLAY_NAME:-Backend}
      DASHBOARD_TITLE: ${DASHBOARD_TITLE:-bongoDev Incident App Observability}
      DASHBOARD_UID: ${DASHBOARD_UID:-bongodev-incident-observability}
      GRAFANA_FOLDER: ${GRAFANA_FOLDER:-bongoDev}
      GRAFANA_DASHBOARD_PROVIDER: ${GRAFANA_DASHBOARD_PROVIDER:-bongoDev Incident Lab}

    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboard-templates:ro
      - ./grafana/render-dashboard.sh:/etc/grafana/render-dashboard.sh:ro

    ports:
      - "3000:3000"

    depends_on:
      - prometheus
      - loki

    networks:
      - monitoring


volumes:
  prometheus_data:
  loki_data:
  alloy_data:
  grafana_data:


networks:

  monitoring:
    driver: bridge

  # Shared with the application stack. Create it once:
  #   docker network create <OBSERVABILITY_NETWORK>
  # Use this same name on the app metrics service in the application Compose file.
  observability:
    external: true
    name: ${OBSERVABILITY_NETWORK:-incident-observability}
