# Prometheus and Loki URLs are the in-network service names. Leave them unchanged
# for another project. Dashboards use datasource uids prometheus and loki.

apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
